# removed the http wrapper as we mounting into conf.d/default.conf to avoid the default.conf file being overwritten by the nginx image from docker compose file

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://app:3000; # Cause inside Docker Compose, services talk to each other by service name, not localhost.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

}