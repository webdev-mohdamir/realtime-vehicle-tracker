services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vehicle-tracker
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    
  redis:
    image: 'redis:alpine'
    ports:
      - '6379:6379'

  nginx:
    image: 'nginx:alpine'
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app